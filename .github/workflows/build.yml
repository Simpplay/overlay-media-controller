name: Build Windows

on:
  pull_request:

  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # Read version.json
      # =====================================================

      - name: Read version.json
        id: version
        shell: pwsh
        run: |
          $json = Get-Content version.json | ConvertFrom-Json

          echo "VERSION=$($json.version)" >> $env:GITHUB_ENV

      # =====================================================
      # Validate tag matches version.json
      # =====================================================

      - name: Validate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $json = Get-Content version.json | ConvertFrom-Json

          $expected = "v$($json.version)"
          $actual = "${{ github.ref_name }}"

          if ($expected -ne $actual) {
            throw "Tag '$actual' does not match version.json '$expected'"
          }

      # =====================================================
      # Node.js
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # =====================================================
      # MSVC
      # =====================================================

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # =====================================================
      # Ninja
      # =====================================================

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # =====================================================
      # Restore vcpkg cache
      # =====================================================

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            build/vcpkg_installed
            out/build/x64-release/vcpkg_installed
          key: >
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      # =====================================================
      # Setup vcpkg
      # =====================================================

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      # =====================================================
      # Configure
      # =====================================================

      - name: Configure CMake
        run: cmake --preset x64-release

      # =====================================================
      # Build
      # =====================================================

      - name: Build
        run: cmake --build --preset build-release

      # =====================================================
      # Package
      # =====================================================

      - name: Package portable ZIP
        run: cmake --build --preset build-release --target package-portable

      # =====================================================
      # Rename ZIP with version
      # =====================================================

      - name: Rename ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem out/build/x64-release/*.zip | Select-Object -First 1

          $newName = "overlay-media-controller-$env:VERSION-win64.zip"

          Rename-Item $zip.FullName $newName

      # =====================================================
      # Upload artifact
      # =====================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-media-controller-${{ env.VERSION }}
          path: |
            overlay-media-controller-${{ env.VERSION }}-win64.zip

      # =====================================================
      # Create GitHub Release
      # =====================================================

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            overlay-media-controller-${{ env.VERSION }}-win64.zip